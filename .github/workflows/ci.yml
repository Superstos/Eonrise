name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Intentional: package support starts at 3.11, but source compatibility is
      # probed back to 3.8 to catch unnecessary breakage.
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m benchmarks.run --quick
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: eonrise --help
      - run: eonrise "how does spaced repetition improve memory retention" --mode assistant --bundle tests/fixtures/papers.json --out /tmp/eonrise-package-smoke --no-memory --no-corpus --no-equivalence --max-rounds 2 --results 10
