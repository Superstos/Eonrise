name: release
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests
      - run: python -m benchmarks.run --quick
  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag matches eonrise.__version__
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import eonrise; print(eonrise.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          [ "$tag" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not match __version__ $version"; exit 1; }
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl && eonrise --demo --out /tmp/eonrise-demo
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/
  # Manual run: rehearse the upload on TestPyPI. Needs a trusted publisher registered on
  # test.pypi.org for this repo, workflow release.yml, environment testpypi.
  publish-test:
    if: github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/eonrise
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
  publish:
    if: github.event_name == 'release'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/eonrise
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
