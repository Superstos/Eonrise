name: evolution-proof
on:
  push:
    branches: ["exp/evolution-proof"]
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Baseline equivalence benchmark
        run: python -m ontology_router.equivalence_benchmark
