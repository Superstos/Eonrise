[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eonrise"
version = "0.5.0"
description = "Iterative, evidence-grounded research query expansion"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
eonrise = "ontology_router.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ontology_router*"]
