[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eonrise"
version = "1.1.0"
description = "Single-root, agent-budget research traversal: one topic, up/down/sideways"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = []

[project.scripts]
eonrise = "ontology_router.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ontology_router*"]
